name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One release at a time per ref, so two pushes to main cannot publish out of order.
concurrency:
  group: stadia-dongle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build stamp
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.stamp.outputs.ts }}
      sha: ${{ steps.stamp.outputs.sha }}
    steps:
      - name: Compute UTC stamp
        id: stamp
        run: |
          echo "ts=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  test-web:
    name: WebHID transport tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Node tests
        run: node --test "tests/**/*.test.mjs"

  build-firmware:
    name: Build ESP32-S3 firmware
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build stamp
        env:
          STADIA_BUILD_TS: ${{ needs.prepare.outputs.ts }}
        run: printf '%s\n' "$STADIA_BUILD_TS" > .stadia-build-ts

      - name: Build with ESP-IDF
        env:
          STADIA_BUILD_TS: ${{ needs.prepare.outputs.ts }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          command: >-
            idf.py build &&
            idf.py size | tee build/firmware-size.txt &&
            python -m esptool --chip esp32s3 merge_bin
            --output build/firmware-merged.bin
            --flash-mode dio --flash-size 8MB --flash-freq 80m
            0x0     build/bootloader/bootloader.bin
            0x8000  build/partition_table/partition-table.bin
            0xf000  build/ota_data_initial.bin
            0x20000 build/stadia-dongle.bin
            &&
            cp build/stadia-dongle.bin build/stadia-dongle-ota.bin

      - name: Summarize firmware size
        run: |
          {
            echo "### Firmware size (${{ needs.prepare.outputs.ts }})"
            echo '```'
            cat build/firmware-size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware-merged.bin
            build/stadia-dongle-ota.bin
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [prepare, build-firmware]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TS: ${{ needs.prepare.outputs.ts }}
          SHORT_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          merged=$(find . -name firmware-merged.bin -print -quit)
          ota=$(find . -name stadia-dongle-ota.bin -print -quit)
          test -n "$merged" && test -n "$ota"
          mv "$merged" "stadia-dongle-${TS}-merged.bin"
          mv "$ota" "stadia-dongle-${TS}-ota.bin"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="build-${TS}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              TAG="build-${TS}-${SHORT_SHA}"
            fi
            TITLE="Firmware ${TS} UTC (${SHORT_SHA})"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE="${GITHUB_REF_NAME}"
          fi

          cat > notes.md <<EOF
          Built ${TS} UTC from \`${SHORT_SHA}\`.

          ## Assets

          - \`stadia-dongle-${TS}-merged.bin\` — full flash image. Use the [web installer](https://preciziei.github.io/stadia-dongle-esp-atoms3u/) or write it at offset 0.
          - \`stadia-dongle-${TS}-ota.bin\` — application image. Upload it from the Wi-Fi Web UI.

          The firmware version reported by the Web UI and the USB configuration page is \`${TS}\`.
          EOF

          gh release create "$TAG" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes-file notes.md \
            "stadia-dongle-${TS}-merged.bin" \
            "stadia-dongle-${TS}-ota.bin"

      - name: Prune old build releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t old < <(gh release list --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.publishedAt) | reverse | .[20:] | .[].tagName')
          if [ "${#old[@]}" -gt 0 ]; then
            for tag in "${old[@]}"; do
              echo "Deleting $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done
          fi

  deploy-pages:
    name: Deploy web installer to GitHub Pages
    needs: [prepare, build-firmware]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: docs/

      - name: Stamp the installer
        env:
          TS: ${{ needs.prepare.outputs.ts }}
          SHORT_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          STAMP="${TS} UTC (${SHORT_SHA})"
          sed -i "s/__BUILD_STAMP__/${STAMP}/g" docs/index.html docs/config.html docs/manifest.json
          printf '%s\n' \
            "{\"timestamp\":\"${TS}\",\"commit\":\"${SHORT_SHA}\",\"firmware\":\"stadia-dongle-${TS}-merged.bin\"}" \
            > docs/build-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
